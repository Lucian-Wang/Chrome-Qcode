<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
    }
    .header h2 {
      margin: 0 0 10px 0;
      color: #333;
    }
    #url-display {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      margin-bottom: 15px;
      padding: 10px;
      background: #fff;
      border-radius: 5px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #fff;
      border-radius: 5px;
    }
    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>网页二维码</h2>
  </div>
  <div id="url-display">加载中...</div>
  <div id="qrcode"></div>
  <div class="footer">扫描二维码访问当前页面</div>
  
  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
